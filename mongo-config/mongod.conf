systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logRotate: rename        # Options: "rename" or "reopen"
  logAppend: true          # Appends to the existing log file after rotation
      # Rotate the log file after it reaches 100 MB
  timeStampFormat: iso8601-utc
  verbosity: 0
storage:
  dbPath: /data/db
net:
  # MongoDB must listen on the container interface so the application can use
  # the private Compose network. Port 27017 is not published to the host.
  bindIpAll: true
